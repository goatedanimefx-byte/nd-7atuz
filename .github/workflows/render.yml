name: render

on:
  workflow_dispatch:
    inputs:
      clip:
        description: "Clip number in colab_input/ (e.g. 1 = Setagaya). Type a topic key to build that clip first."
        required: false
        default: "1"
  push:
    branches: ["main"]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System dependencies (ffmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-liberation fonts-dejavu-core fonts-noto-core fonts-freefont-ttf

      - name: Python dependencies
        run: pip install edge-tts playwright pillow numpy fpdf2

      - name: Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Render clip
        shell: bash
        env:
          CLIP: ${{ inputs.clip || '1' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: python ci_render.py --clip "$CLIP"

      - name: Upload final.mp4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-mp4
          path: /tmp/colab-auto/sink/out/final.mp4
          if-no-files-found: warn